name: Secure Encryption source checks

on:
  push:
    branches: [secure-encryption-devsecops]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: secure-encryption/app
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install application and security tools
        run: python -m pip install -r requirements.lock bandit==1.9.4 pip-audit==2.10.1
      - name: Application tests
        run: python tests.py
      - name: Gitleaks repository and history scan
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: Bandit source scan
        run: bandit -ll app.py aws_ops.py wsgi.py
      - name: Audit locked Python dependencies
        run: pip-audit -r requirements.lock --strict
